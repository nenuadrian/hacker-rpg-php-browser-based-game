name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Create release archive
        run: |
          tar czf secretrepublic-${{ github.ref_name }}.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='.gitignore' \
            .
          zip -r secretrepublic-${{ github.ref_name }}.zip . \
            -x '.git/*' '.github/*' 'tests/*' '.gitignore'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            secretrepublic-${{ github.ref_name }}.tar.gz
            secretrepublic-${{ github.ref_name }}.zip
